<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turnstile diagnostic</title>
<style>
  body{font:15px/1.6 system-ui,sans-serif;margin:0;padding:32px;background:#faf7f0;color:#1a1a1a}
  .card{max-width:560px;margin:0 auto;background:#fff;border:1px solid #e7e2da;border-radius:12px;padding:24px}
  h1{font-size:18px;margin:0 0 4px}
  p.sub{margin:0 0 20px;color:#6b6b6b;font-size:13px}
  #status{margin-top:20px;padding:14px;border-radius:8px;font-family:ui-monospace,monospace;font-size:13px;word-break:break-all}
  .wait{background:#f4f4f5;color:#52525b}
  .ok{background:#dcfce7;color:#14532d}
  .err{background:#fee2e2;color:#7f1d1d}
  .big{font-size:22px;font-weight:700;display:block;margin-bottom:6px}
  button{margin-top:16px;padding:8px 16px;border-radius:999px;border:1px solid #1a1a1a;background:#1a1a1a;color:#fff;font-size:13px;cursor:pointer}
  dl{margin:20px 0 0;font-size:12px;color:#6b6b6b}
  dt{font-weight:600;margin-top:8px}
</style>
</head>
<body>
<div class="card">
  <h1>Turnstile diagnostic</h1>
  <p class="sub">The widget on its own — no app code, no React. Whatever happens here is Cloudflare talking directly to your browser.</p>
  <div id="w"></div>
  <div id="status" class="wait">waiting for the widget…</div>
  <button onclick="location.reload()">Run again</button>
  <dl>
    <dt>Page hostname</dt><dd id="host"></dd>
    <dt>Sitekey in use</dt><dd>0x4AAAAAAExZA8OCzdQYAVa3</dd>
    <dt>Cookies enabled</dt><dd id="ck"></dd>
  </dl>
</div>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<script>
  document.getElementById('host').textContent = location.hostname;
  document.getElementById('ck').textContent = navigator.cookieEnabled ? 'yes' : 'NO — this alone can fail the challenge';
  var el = document.getElementById('status');
  function show(cls, big, detail){
    el.className = cls;
    el.innerHTML = '<span class="big">' + big + '</span>' + (detail || '');
  }
  var started = Date.now();
  function boot(){
    if (!window.turnstile) { return setTimeout(boot, 100); }
    window.turnstile.render('#w', {
      sitekey: '0x4AAAAAAExZA8OCzdQYAVa3',
      action: 'diagnostic',
      theme: 'light',
      callback: function(t){
        show('ok', 'PASSED', 'token issued after ' + ((Date.now()-started)/1000).toFixed(1) + 's<br><br>' + t.slice(0,60) + '…');
      },
      'error-callback': function(code){
        show('err', 'ERROR ' + (code || '(none reported)'),
             'Send this number back — it identifies the cause exactly.');
      },
      'expired-callback': function(){ show('wait', 'EXPIRED', 'token timed out; press Run again'); },
      'timeout-callback': function(){ show('err', 'TIMEOUT', 'the challenge itself timed out'); }
    });
    show('wait', 'RUNNING', 'solve the checkbox if one appears');
  }
  boot();
</script>
</body>
</html>
