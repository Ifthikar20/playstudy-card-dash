<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The tab icon. SVG so one file covers every density; the old favicon.ico
         was the previous brand's badge and has been removed rather than left to
         show up in the one place nobody checks. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/an-logo.svg" />
    <!-- Site-wide defaults. Pages swap the title, description and canonical URL
         while they're open (src/lib/pageMeta.ts), and read these back as the
         defaults, so this is the one place to change them. -->
    <title>AnotherNotes: Your notes, in motion</title>
    <meta name="description" content="Drop in your notes, slides or a PDF. They come back written up section by section, read aloud to you, with quizzes and flashcards to test what you know." />
    <link rel="canonical" href="https://anothernote.app/" />
    <meta name="theme-color" content="#fff9f0" />
    <meta name="author" content="AnotherNotes" />

    <!-- Link previews (WhatsApp, iMessage, Slack, X, LinkedIn…). Their crawlers
         don't run JavaScript, so these describe the whole site. The image is
         public/og-image.png, 1200×630. -->
    <meta property="og:site_name" content="AnotherNotes" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://anothernote.app/" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="AnotherNotes: Your notes, in motion" />
    <meta property="og:description" content="Notes written up for you, read aloud, and turned into quizzes and flashcards." />
    <meta property="og:image" content="https://anothernote.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AnotherNotes. Your notes, in motion." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AnotherNotes: Your notes, in motion" />
    <meta name="twitter:description" content="Notes written up for you, read aloud, and turned into quizzes and flashcards." />
    <meta name="twitter:image" content="https://anothernote.app/og-image.png" />

    <!-- Pre-paint theme bootstrap: apply the stored theme before CSS loads so a
         dark reload never flashes white. Mirrors ThemeToggle.tsx. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('theme');
          var dark = pref === 'dark' || pref === 'dark-grey' ||
            (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts: Inter for the whole app UI, Patrick Hand for the handwritten accents -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=Patrick+Hand&display=swap" rel="stylesheet">
    
    <!-- Google reCAPTCHA v3 -->
    <script src="https://www.google.com/recaptcha/api.js?render=explicit" async defer></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
