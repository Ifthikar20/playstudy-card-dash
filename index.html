<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The tab icon. SVG so one file covers every density; the old favicon.ico
         was the previous brand's badge and has been removed rather than left to
         show up in the one place nobody checks. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/an-logo.svg" />
    <title>AnotherNotes</title>
    <meta name="description" content="AnotherNotes - Transform your study materials into engaging, competitive quizzes" />
    <meta name="author" content="AnotherNotes" />

    <meta property="og:title" content="AnotherNotes - AI-Powered Study Platform" />
    <meta property="og:description" content="Transform your study materials into engaging, competitive quizzes" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Pre-paint theme bootstrap: apply the stored theme before CSS loads so a
         dark reload never flashes white. Mirrors ThemeToggle.tsx. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('theme');
          var dark = pref === 'dark' || pref === 'dark-grey' ||
            (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts: Inter for the whole app UI, Patrick Hand for the handwritten accents -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=Patrick+Hand&display=swap" rel="stylesheet">
    
    <!-- Google reCAPTCHA v3 -->
    <script src="https://www.google.com/recaptcha/api.js?render=explicit" async defer></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
