# AnotherNotes SPA + API on one origin.
#
# deploy-aws.sh in this repo writes this file to /opt/playstudy/nginx.conf on
# the box and reloads nginx after `nginx -t` accepts it. The stack itself
# (docker-compose.yml) belongs to playstudy-backend.
#
# Note on headers: every add_header below sits at server level and there is
# deliberately NOT a single add_header inside any location block. nginx's
# add_header is replace-not-merge — one add_header in a nested location drops
# every header inherited from the parent, which silently voids the CSP that
# Turnstile depends on. If you add a caching or security header to a location
# later, you must repeat the whole set there.

# Maintenance gate. While it is on, every visitor gets maintenance.html (status
# 503) and the API answers 503, except a browser holding the preview cookie:
# open the console on the maintenance page and run  unlock("<key>").
# The two marked lines are rewritten on the box from /opt/playstudy/maintenance.key
# (deploy-aws.sh and maintenance.sh do it): no key file means the gate is off.
# The key itself never lives in this repo.
map $cookie_an_preview $an_maintenance {
    default 0;   # MAINTENANCE-DEFAULT
    # MAINTENANCE-KEY
}

# What the gate does with a request: "" = serve normally, "gate" = the 503
# maintenance page, "preview" = the same page with status 200 for link-preview
# bots. WhatsApp, iMessage, Slack, X, LinkedIn and Discord show no preview for a
# 503, so sharing the link during maintenance would show nothing. Search crawlers
# still get the 503, so nothing is indexed. First matching regex wins.
map "$an_maintenance:$http_user_agent" $an_gate {
    default "";
    "~*^1:.*(facebookexternalhit|Facebot|Twitterbot|Slackbot|Slack-ImgProxy|LinkedInBot|WhatsApp|Discordbot|TelegramBot|SkypeUriPreview|redditbot|Embedly)" "preview";
    "~^1:" "gate";
}

# Headers that only some responses get. nginx leaves out a header whose value is
# empty, so these can sit at server level with the others (see the note above).
# The 503 maintenance responses: don't cache, and try again in an hour.
map $status $maint_retry_after { 503 "3600";     default ""; }
map $status $maint_no_store    { 503 "no-store"; default ""; }
# HTTPS only, for the real domain behind Cloudflare. Never on the bare IP, whose
# certificate is self-signed: browsers would then refuse it outright.
map $host $hsts {
    anothernote.app     "max-age=15552000";
    www.anothernote.app "max-age=15552000";
    default             "";
}

# Concerns and requests sent from the maintenance page's form. nginx appends each
# one to /var/log/nginx/concerns.log inside the nginx container: a temporary store
# that survives reloads and restarts but not a re-created container. Read them with
# ./maintenance.sh concerns. The API may be gated, so this never touches the backend.
log_format concerns escape=json '{"time":"$time_iso8601","ip":"$remote_addr","ua":"$http_user_agent","body":"$request_body"}';
limit_req_zone $binary_remote_addr zone=concerns:1m rate=5r/m;
# Log only what was accepted: a refused GET, an oversized body or a rate-limited
# post would otherwise leave an empty row.
map $status $concern_accepted {
    204     1;
    default 0;
}

server {
    listen 80;
    # HTTPS with a self-signed certificate (deploy-aws.sh creates it on the box).
    # Browsers only allow the microphone on secure pages, so Teach mode's voice
    # input needs this until a real domain and certificate front the box.
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    server_name _;

    # Find the backend through Docker's DNS on each request (cached 10s) instead of
    # once at start-up. With a literal host in proxy_pass, `nginx -t` fails whenever
    # the backend container is down (so maintenance.sh could not put the page up
    # during a backend outage), and nginx kept a stale IP after the backend was
    # re-created. A variable in proxy_pass, with no URI, passes the request path on
    # unchanged: /api/x stays /api/x and /health stays /health.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare terminates TLS at the edge and forwards here over plain HTTP,
    # so the socket peer is a Cloudflare node. Take the visitor's address from
    # the header Cloudflare sets, but ONLY when the connection really comes from
    # Cloudflare: with 0.0.0.0/0 here, anyone reaching the box directly could put
    # any address in CF-Connecting-IP and pick their own rate-limit bucket.
    # Cloudflare's published ranges (https://www.cloudflare.com/ips/), as of 2026-09.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # Turnstile needs to fetch its script from challenges.cloudflare.com and to
    # open its challenge in an iframe from the same host. frame-src is the one
    # people forget; without it the widget renders as an empty box.
    # No 'unsafe-eval': nothing in the app builds code from strings any more (the
    # graph plotter has its own expression parser), so a stored note that slipped
    # past the sanitizer would still have no eval to reach. object-src 'none'
    # closes the plugin/Flash-era vectors the default-src would otherwise allow.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://static.cloudflareinsights.com https://www.google.com https://www.gstatic.com; frame-src 'self' https://challenges.cloudflare.com https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://challenges.cloudflare.com https://cloudflareinsights.com; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No framing by other sites (clickjacking); frame-ancestors above is the modern form.
    add_header X-Frame-Options "SAMEORIGIN" always;
    # The app uses the microphone (Teach mode) and the clipboard, nothing else here.
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=(), display-capture=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Strict-Transport-Security $hsts always;
    add_header Retry-After $maint_retry_after always;
    add_header Cache-Control $maint_no_store always;

    client_max_body_size 25m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        if ($an_maintenance) {
            return 503 '{"detail":"AnotherNote is down for maintenance"}';
        }
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # One address, the visitor's ($remote_addr is already the CF-Connecting-IP
        # value for Cloudflare traffic). $proxy_add_x_forwarded_for would append to
        # whatever the client sent, and the API keys its rate limits on this header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # SSE, question streams and the tutor's voice arrive as chunks and must not
        # be buffered, or they arrive at once when the response is complete.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # The maintenance page's "send a concern or request" form. Open whether or not the
    # gate is on (an exact match wins over /api/ above). nginx only fills in
    # $request_body when it proxies, so it proxies to the tiny 204 server at the
    # bottom of this file; the body is kept in memory (buffer = max size) so the
    # variable is never empty.
    location = /api/maintenance/concern {
        limit_except POST { deny all; }
        limit_req zone=concerns burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        client_body_buffer_size 8k;
        access_log /var/log/nginx/concerns.log concerns if=$concern_accepted;
        proxy_pass http://127.0.0.1:8098/;
    }

    location = /health {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # Caching. index.html names the current build's files, so a browser that
    # keeps an old copy keeps showing the old site after a deploy (it happened
    # on 2026-09-21: no Cache-Control at all, so browsers guessed a lifetime
    # from Last-Modified). Everything outside /assets/ is revalidated on every
    # visit, which costs a 304 when nothing changed. Files under /assets/ carry
    # a content hash in their name, so they can be kept for a year.
    # `expires` rather than add_header: an add_header in these blocks would
    # drop the security headers above (see the note at the top).
    location /assets/ {
        if ($an_maintenance) { return 503; }   # not 404: Cloudflare caches 404s, never 503s
        expires 1y;
        try_files $uri =404;
    }

    # PDF.js's worker (Full Study's PDF view) is an ES module named *.mjs. The stock
    # mime.types has no .mjs, and a browser refuses a module worker served as
    # application/octet-stream - nosniff above makes sure of it. A `types` block
    # replaces the whole map, so it lives in a location that only serves .mjs files.
    location ~* \.mjs$ {
        if ($an_maintenance) { return 503; }   # not 404: Cloudflare caches 404s, never 503s
        types { application/javascript mjs; }
        expires 1y;
        try_files $uri =404;
    }

    # Public brand files, outside the gate: link previews need og-image.png, the
    # maintenance page uses the icons, and robots.txt should never be a 503.
    location ~ ^/(og-image\.png|favicon\.svg|an-logo\.svg|robots\.txt)$ {
        expires 1h;
    }

    # The static Terms and Conditions page. It is linked from maintenance.html, so it
    # sits outside the gate and can be read while the site is down.
    location = /terms.html {
        expires -1;
    }

    # SPA fallback: every unknown path is a client-side route.
    location / {
        if ($an_gate = "preview") { rewrite ^ /maintenance.html last; }
        if ($an_gate = "gate") { return 503; }
        error_page 503 /maintenance.html;
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Reached only from location / (error_page for the 503, or the preview-bot
    # rewrite), so it keeps the 503 status for people and search engines. The page is self-contained
    # (no /assets, no logo file), because everything else is gated.
    location = /maintenance.html {
        internal;
        expires -1;
    }
}

# Swallows the concern form's POST once nginx has read (and logged) its body.
server {
    listen 127.0.0.1:8098;
    access_log off;
    location / { return 204; }
}
