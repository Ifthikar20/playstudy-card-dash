# AnotherNotes SPA + API on one origin.
#
# deploy-aws.sh in this repo writes this file to /opt/playstudy/nginx.conf on
# the box and reloads nginx after `nginx -t` accepts it. The stack itself
# (docker-compose.yml) belongs to playstudy-backend.
#
# Note on headers: every add_header below sits at server level and there is
# deliberately NOT a single add_header inside any location block. nginx's
# add_header is replace-not-merge — one add_header in a nested location drops
# every header inherited from the parent, which silently voids the CSP that
# Turnstile depends on. If you add a caching or security header to a location
# later, you must repeat the whole set there.

server {
    listen 80;
    # HTTPS with a self-signed certificate (deploy-aws.sh creates it on the box).
    # Browsers only allow the microphone on secure pages, so Teach mode's voice
    # input needs this until a real domain and certificate front the box.
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare terminates TLS at the edge and forwards here over plain HTTP,
    # so the socket peer is a Cloudflare node. Take the visitor's address from
    # the header Cloudflare sets instead.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0;

    # Turnstile needs to fetch its script from challenges.cloudflare.com and to
    # open its challenge in an iframe from the same host. frame-src is the one
    # people forget; without it the widget renders as an empty box.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com https://static.cloudflareinsights.com https://www.google.com https://www.gstatic.com; frame-src 'self' https://challenges.cloudflare.com https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://challenges.cloudflare.com https://cloudflareinsights.com; media-src 'self' blob:; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # SSE / streaming responses must not be buffered or they arrive at once.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # Caching. index.html names the current build's files, so a browser that
    # keeps an old copy keeps showing the old site after a deploy (it happened
    # on 2026-09-21: no Cache-Control at all, so browsers guessed a lifetime
    # from Last-Modified). Everything outside /assets/ is revalidated on every
    # visit, which costs a 304 when nothing changed. Files under /assets/ carry
    # a content hash in their name, so they can be kept for a year.
    # `expires` rather than add_header: an add_header in these blocks would
    # drop the security headers above (see the note at the top).
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # PDF.js's worker (Full Study's PDF view) is an ES module named *.mjs. The stock
    # mime.types has no .mjs, and a browser refuses a module worker served as
    # application/octet-stream - nosniff above makes sure of it. A `types` block
    # replaces the whole map, so it lives in a location that only serves .mjs files.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback: every unknown path is a client-side route.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
